[project]
name = "mcp-gateway"
version = "1.0.3"
requires-python = ">=3.12"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
exclude = ["alembic/"]

# These modules still use legacy SQLAlchemy patterns that mypy interprets as
# Column[...] at runtime-facing callsites.
#
# Be aware of what this costs: the list below covers nearly the whole
# application, so `mypy app/` currently verifies very little. Treat a passing
# mypy run as a weak signal until the list shrinks.
#
# Measured error counts when each override is lifted individually (2026-09-19)
# — use these to pick off the cheap ones first:
#
#   app.api.tenants 1      app.config 1           app.core.dependencies 1
#   app.main 1             app.services.llm 1     app.tools 1
#   app.api.connections 2  app.api.mcp_sse 3      app.api.tools 3
#   app.api.auth 4         app.tools.filesystem 4 app.api.api_keys 5
#   app.api.query 5        app.models 5           app.tools.example 5
#   app.api.auth_entra 10  app.services.entra 10  app.api.oauth 17
#   app.tools.sql 21
#
# Migrating app.models to Mapped[] first should reduce several of the others.
# Remove each entry here as its module is fixed; do not add new ones.
[[tool.mypy.overrides]]
module = [
  "app.api.api_keys",
  "app.api.auth",
  "app.api.auth_entra",
  "app.api.connections",
  "app.api.mcp_sse",
  "app.api.oauth",
  "app.api.query",
  "app.api.tenants",
  "app.api.tools",
  "app.config",
  "app.core.dependencies",
  "app.main",
  "app.models",
  "app.services.entra",
  "app.services.llm",
  "app.tools",
  "app.tools.example",
  "app.tools.filesystem",
  "app.tools.sql",
]
ignore_errors = true

[tool.semantic_release]
version_toml = ["pyproject.toml:project.version"]
# Keep every other copy of the version in lockstep. app/__init__.py feeds the
# FastAPI/OpenAPI version; server.json is the MCP registry manifest. Without
# these, both silently drift on each release.
version_variables = [
    "app/__init__.py:__version__",
    "server.json:\"version\"",
]
branch = "main"
changelog_file = "CHANGELOG.md"
build_command = ""
upload_to_pypi = false
upload_to_vcs_release = true
commit_message = "chore(release): {version} [skip ci]"

[tool.semantic_release.commit_parser_options]
# Conventional commit types that trigger a release
# feat → minor bump, fix/perf → patch bump, breaking change → major bump
allowed_tags = ["feat", "fix", "perf", "refactor", "docs", "chore", "ci", "test", "style"]
minor_tags = ["feat"]
patch_tags = ["fix", "perf"]

[tool.semantic_release.changelog]
exclude_commit_patterns = [
  "chore\\(release\\):",
  "chore\\(deps\\):",
  "Merge pull request",
  "Merge branch",
]

[tool.semantic_release.branches.main]
match = "main"
prerelease = false
