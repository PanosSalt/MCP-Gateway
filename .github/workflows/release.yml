name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    concurrency: release
    # Skip the release commit itself to avoid an infinite loop
    if: "!contains(github.event.head_commit.message, '[skip ci]')"

    steps:
      # main is protected: PRs only, no direct pushes. This app is the sole
      # non-human bypass actor on that ruleset, scoped to contents:write only,
      # so the release commit/tag can land without opening main up to humans.
      - uses: actions/create-github-app-token@v1
        id: app-token
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_KEY }}

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # full history so PSR can read all commits
          token: ${{ steps.app-token.outputs.token }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install python-semantic-release
        run: pip install python-semantic-release

      - name: Capture version before release
        id: before
        run: echo "v=$(grep -m1 '^version = ' pyproject.toml)" >> "$GITHUB_OUTPUT"

      - name: Run semantic release
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: semantic-release version --push --changelog --vcs-release

      - name: Capture version after release
        id: after
        run: echo "v=$(grep -m1 '^version = ' pyproject.toml)" >> "$GITHUB_OUTPUT"

      # Only publish to the MCP Registry when semantic-release actually cut
      # a new version (it no-ops on commits that don't warrant a release).
      - name: Install mcp-publisher
        if: steps.before.outputs.v != steps.after.outputs.v
        run: |
          curl -L "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz mcp-publisher

      - name: Sync version into server.json
        if: steps.before.outputs.v != steps.after.outputs.v
        run: |
          VERSION=$(grep -m1 '^version = ' pyproject.toml | cut -d'"' -f2)
          jq --arg v "$VERSION" '.version = $v' server.json > server.tmp.json
          mv server.tmp.json server.json

      - name: Authenticate to MCP Registry
        if: steps.before.outputs.v != steps.after.outputs.v
        run: ./mcp-publisher login github-oidc

      - name: Publish server to MCP Registry
        if: steps.before.outputs.v != steps.after.outputs.v
        run: ./mcp-publisher publish
